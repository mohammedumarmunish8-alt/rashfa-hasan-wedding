<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Invitation Manager</title><link rel="stylesheet" href="style.css"><style>body{background:#fff8f7}.manager{max-width:850px;margin:45px auto;padding:24px}.panel{background:white;border:1px solid #ecd7d9;border-radius:20px;padding:25px;margin:18px 0}.manager input,.manager select{width:100%;padding:13px;border:1px solid #d8b9bf;border-radius:10px;margin:8px 0 15px}.manager button{cursor:pointer}.manager table{width:100%;border-collapse:collapse}.manager th,.manager td{text-align:left;border-bottom:1px solid #eee;padding:9px;overflow-wrap:anywhere}.muted{color:#796c6c}.hidden{display:none}a{color:#8d5968}</style></head><body><div class="manager"><a href="index.html">← Back to invitation</a><h1>Invitation Manager</h1><p class="muted" id="mode"></p><section class="panel hidden" id="invite-tools"><h2>Generate guest invitation links</h2><label>Guest or family name<input id="guest" placeholder="e.g. Ayesha & Family" maxlength="80"></label><label>Invited by<input id="sender" value="B K Abdul Rauf & Safana" maxlength="50"></label><button class="primary" id="generate">Generate link</button><label>Personalized invitation link<input id="link" readonly></label><button class="outline" id="copy">Copy link</button><button class="outline" id="share">Share on WhatsApp</button></section><section class="panel" id="signin"><h2>Private records</h2><p id="authhelp">Sign in with your authorized Firebase administrator account to view shared guest responses.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">Sign in</button><p id="status" role="status"></p></section><section class="panel hidden" id="records"><h2>RSVP Responses</h2><div id="rsvps"></div><h2>Guestbook moderation</h2><div id="wishes"></div><button class="outline" id="logout">Sign out</button></section></div><script type="module" src="admin.js"></script></body></html>
